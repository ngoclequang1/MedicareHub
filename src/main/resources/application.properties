spring.application.name=MedicareHub

# MYSQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medicarehubdb?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

# SERVER
server.servlet.session.timeout=30m

# THYMELEAF
spring.thymeleaf.cache=false

# OPTIONAL INITIAL ADMIN (leave blank to disable)
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# EMAIL (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@example.com}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# REMINDERS
app.reminders.poll-interval-ms=${REMINDER_POLL_INTERVAL_MS:60000}
